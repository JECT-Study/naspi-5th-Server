plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.cloud.tools.jib' version '3.4.5'
}

group = 'kr.ject'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:4.0.4'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Google Java Style 기반, 들여쓰기만 4칸으로 변경 (https://google.github.io/styleguide/javaguide.html)
checkstyle {
	toolVersion = '10.21.4'
	configFile = file('config/checkstyle/google-checks-4space.xml')
	configProperties = ['org.checkstyle.google.suppressionfilter.config': file('config/checkstyle/checkstyle-suppressions.xml')]
	// 규칙 severity가 warning이므로 경고 1개라도 있으면 실패 처리
	maxWarnings = 0
}

// 로컬: ./gradlew jibDockerBuild -> 로컬 Docker에 jectteam2/naspi-server:<version> 이미지 생성
//       ./gradlew jib            -> Docker Hub에 jectteam2/naspi-server:<version> push
// CI:   -Djib.to.image=<repo>:<commit sha> 로 태그 덮어씀
jib {
	// devtools(developmentOnly)가 이미지에 포함되지 않도록 운영용 classpath 사용
	configurationName = 'productionRuntimeClasspath'
	from {
		image = 'eclipse-temurin:21-jre'
	}
	to {
		image = "docker.io/jectteam2/naspi-server:${project.version}-20261011-2b34729"

		// 로컬: gradle.properties(gitignore) 의 Docker Hub 계정 사용
		// CI: gradle.properties 가 없으므로 auth 를 설정하지 않고 docker login 결과(~/.docker/config.json) 사용
		def dockerHubUsername = providers.gradleProperty('dockerHubUsername').orNull
		def dockerHubToken = providers.gradleProperty('dockerHubToken').orNull
		if (dockerHubUsername && dockerHubToken) {
			auth {
				username = dockerHubUsername
				password = dockerHubToken
			}
		}
	}
	container {
		ports = ['8080']
		user = '1000:1000'
		// k8s ConfigMap 으로 주입한 JAVA_ARGS 를 JVM 옵션으로 적용하기 위해 sh 를 거쳐 실행
		// exec: java 를 PID 1 로 띄워 SIGTERM 을 직접 받도록 함 (graceful shutdown)
		entrypoint = ['sh', '-c', 'exec java $JAVA_ARGS -cp @/app/jib-classpath-file @/app/jib-main-class-file']
	}
	// IntelliJ 등에서 띄운 Gradle 데몬은 PATH에 docker가 없을 수 있어 주요 설치 경로를 직접 탐색
	def dockerExecutable = ['/usr/local/bin/docker', '/opt/homebrew/bin/docker', '/usr/bin/docker']
		.find { file(it).canExecute() }
	if (dockerExecutable) {
		dockerClient {
			executable = dockerExecutable
		}
	}
}
