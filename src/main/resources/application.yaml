spring:
  application:
    name: naspi
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://naspi-db-svc:5432/naspi}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

---
# k8s 배포 환경(JAVA_ARGS 의 spring.profiles.active)에서만 콘솔 로그를 Logstash JSON 형식으로 출력
# 로컬(프로필 없음)은 기존 텍스트 형식 유지
spring:
  config:
    activate:
      on-profile: development | production

logging:
  structured:
    format:
      console: logstash
