spring:
  application:
    name: naspi
  # 프로필: local(로컬 개발), development / production(k8s, JAVA_ARGS 의 spring.profiles.active 로 지정).
  # 프로필을 지정하지 않으면 production 으로 동작한다. 로컬 실행 시 local 을 지정한다.
  profiles:
    default: production
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://naspi-db-svc:5432/naspi}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # 로그인 세션 저장소. 접속 정보는 환경 변수로 주입한다 (k8s: manifest 의 naspi-cm-common).
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  session:
    # 로그인 전 세션(카카오 인증 진행 중, 가입 대기)의 유지 시간.
    # 로그인을 마치면 naspi.auth.login-session-timeout 으로 늘린다.
    timeout: 10m
    data:
      redis:
        namespace: naspi:session
  security:
    # 카카오 로그인. 키는 임시 값이므로 카카오 개발자 콘솔에서 발급받은 값을 환경 변수로 주입한다.
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # 닉네임만 받는다. 이메일은 수집하지 않는다 (정책 v1 §1).
            scope: profile_nickname
        # 카카오는 Spring Security에 기본 등록된 제공자가 아니므로 엔드포인트를 직접 지정한다.
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  # TLS 는 Gateway 에서 끝나므로 X-Forwarded-* 헤더로 원래 주소(prod https://api.naspi.my, dev https://dev.api.naspi.my)를 복원한다.
  # 없으면 카카오 redirect_uri 가 http:// 로 만들어져 카카오 콘솔 등록값과 어긋난다 (KOE006).
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # 브라우저를 닫아도 로그인이 유지되도록 쿠키를 로그인 유지 기간만큼 둔다.
        # 요청마다 다시 내려보내므로 마지막 요청 기준으로 연장된다 (SessionCookieRefreshFilter).
        max-age: 7d
        http-only: true
        # 프론트(naspi.my)와 API(api.naspi.my)는 같은 사이트이므로 same-site 는 기본값(Lax)을 쓴다.
        secure: true

naspi:
  auth:
    # 로그인 유지 기간. 마지막 요청으로부터 이 기간 동안 요청이 없으면 로그아웃된다.
    login-session-timeout: 7d
    # 카카오 로그인 후 이동할 프론트 경로. 출처는 로그인을 시작한 프론트 출처(Referer)를 따른다 (LoginRedirect).
    # 허용 출처(naspi.cors.allowed-origins)가 아니거나 알 수 없으면(직접 접속 등) 허용 출처의 첫 번째로 이동한다.
    redirect:
      # 기존 회원 로그인 완료
      login-success-path: /
      # 카카오 이름에 한글이 없는 신규 회원. 이름 입력 후 POST /api/members/signup 호출
      name-input-path: /signup
      # 카카오 인증 실패 또는 사용자 취소
      login-failure-path: /login-failure
  cors:
    # API 호출과 로그인 후 이동을 허용할 프론트 출처. 여러 개면 쉼표로 구분하고, 첫 번째가 로그인 후 기본 이동 출처다.
    # 프로필별 값은 아래 development / local 프로필에 있다. 환경 변수가 있으면 그 값을 쓴다.
    allowed-origins: ${NASPI_CORS_ALLOWED_ORIGINS:https://www.naspi.my,https://naspi.my}
  # Swagger UI·API 문서 접속 계정 (HTTP Basic). k8s: ID는 naspi-cm-common, 비밀번호는 naspi-secret-common
  # 로컬도 SWAGGER_PASSWORD 환경 변수를 직접 주입한다 (IDE 실행 설정 등).
  # 기본값을 빈 값으로 둬야 변수가 없을 때 시작에 실패한다. 기본값이 없으면 "${SWAGGER_PASSWORD}" 문자열이 비밀번호가 된다.
  swagger:
    username: ${SWAGGER_USERNAME:nspusr}
    password: ${SWAGGER_PASSWORD:}
  # 실시간 메시지 (STOMP over WebSocket, 엔드포인트 /ws). WebSocketProperties 참고
  websocket:
    # 서버·클라이언트 heartbeat 간격
    heartbeat: 10s
    # 주기 발행 스레드 수. 동시에 실행될 수 있는 주기 토픽 수 이상으로 둔다
    scheduler-pool-size: 2
    # 주기 발행 토픽별 간격. 여기에 없는 토픽은 주기 발행하지 않는다 (이벤트 발행만 사용)
    # 예) topics.ranking.interval: 10s
    # TODO: 아래 토픽은 실제 발행 구현 전까지 더미 응답을 주기적으로 보낸다. 구현하면 주기를 조정하거나 지운다
    topics:
      # 캔들 차트 (CandleChartTopic)
      candles:
        interval: 5s
      # 내 자산 (AssetTopic)
      assets:
        interval: 1s
      # 알림 (AlertTopic)
      alerts:
        interval: 10s
      # 종목 정보 (StockTopic)
      stocks:
        interval: 1s
      # 호가 (OrderBookTopic)
      orderbook:
        interval: 1s

logging:
  structured:
    format:
      console: logstash

# 관측성 (actuator, 메트릭, 트레이스)
management:
  server:
    # actuator 는 Gateway 로 공개된 8080 이 아닌 별도 포트로만 노출한다 (Alloy 가 scrape).
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        # k8s probe 가 실제 서비스 포트를 확인하도록 메인 포트(8080)에 /livez, /readyz 를 추가로 연다.
        add-additional-paths: true
      group:
        # DB·Redis 에 연결할 수 없으면 트래픽을 받지 않는다.
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: naspi-server
  tracing:
    sampling:
      # 트레이스 수집 비율 (0.0 ~ 1.0). 트래픽이 늘면 환경 변수로 낮춘다.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # 트레이스를 보낼 OTLP(HTTP) 수신 주소. 클러스터 안의 Alloy 가 받아 Tempo 로 넘긴다.
          endpoint: ${OTLP_TRACING_ENDPOINT:http://alloy.monitoring.svc:4318/v1/traces}

---
spring:
  config:
    activate:
      on-profile: local
  # 로컬은 H2 인메모리 DB 를 쓴다. 테이블은 엔티티 기준으로 자동 생성되고 앱을 끄면 데이터가 사라진다.
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:naspi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  # H2 콘솔: http://localhost:8080/h2-console (JDBC URL 은 위 datasource.url, 사용자 sa, 비밀번호 없음)
  h2:
    console:
      enabled: true
  # 로컬 Redis (docker run -d --name naspi-redis -p 6379:6379 redis:7)
  data:
    redis:
      host: localhost
      port: 6379

naspi:
  cors:
    # 로컬 프론트 (Vite 기본 포트 5173)
    allowed-origins: http://localhost:5173

server:
  servlet:
    session:
      cookie:
        # 로컬은 http 이므로 secure 쿠키를 끈다 (Safari 는 localhost 에서도 secure 쿠키를 받지 않는다).
        secure: false

management:
  tracing:
    export:
      otlp:
        # 로컬에는 Alloy 가 없으므로 트레이스를 보내지 않는다 (연결 실패 로그 방지). traceId 는 계속 생성되어 로그에 남는다.
        enabled: false

---
# k8s 배포 환경(JAVA_ARGS 의 spring.profiles.active)에서만 콘솔 로그를 Logstash JSON 형식으로 출력
# 로컬(프로필 없음)은 기존 텍스트 형식 유지
spring:
  config:
    activate:
      on-profile: development

# dev 서버(dev.api.naspi.my)는 로컬 프론트(local.naspi.my:5173, hosts 로 127.0.0.1 지정)와 배포된 프론트를 모두 받는다.
# 첫 번째(local.naspi.my)가 로그인 후 기본 이동 출처다. 환경 변수(k8s: naspi-cm-common)가 있으면 그 값을 쓴다.
naspi:
  cors:
    # localhost 는 dev.api.naspi.my 와 다른 사이트라 SameSite=Lax 세션 쿠키가 실리지 않는다 (로그인 필요 API 는 local.naspi.my 로)
    allowed-origins: ${NASPI_CORS_ALLOWED_ORIGINS:https://local.naspi.my:5173,http://localhost:5173,https://www.naspi.my,https://naspi.my}
