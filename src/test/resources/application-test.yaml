# 테스트(CI) 전용 설정. 실제 DB 없이 context 가 뜨도록 H2 로 덮어씀
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:naspi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  # 테스트는 Redis 에 실제로 연결하지 않지만, 접속 정보 환경 변수가 없으므로 값을 채워 둔다
  data:
    redis:
      host: localhost
      port: 6379

# 프론트 주소가 바뀌어도 테스트가 영향받지 않도록 리다이렉트 경로를 고정한다
naspi:
  auth:
    redirect:
      login-success-path: /
      name-input-path: /signup
      login-failure-path: /login-failure
  cors:
    # 첫 번째가 로그인 후 기본 이동 출처
    allowed-origins: https://front.test,https://local-front.test:5173
  # Swagger 접속 계정 (테스트 전용 값)
  swagger:
    username: swagger-test
    password: swagger-test-pw
