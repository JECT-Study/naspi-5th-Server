# 테스트(CI) 전용 설정. 실제 DB 없이 context 가 뜨도록 H2 로 덮어씀
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:naspi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  # 테스트는 Redis 에 실제로 연결하지 않지만, 접속 정보 환경 변수가 없으므로 값을 채워 둔다
  data:
    redis:
      host: localhost
      port: 6379

# 프론트 주소가 바뀌어도 테스트가 영향받지 않도록 리다이렉트 경로를 고정한다
naspi:
  auth:
    redirect:
      login-success-url: /
      name-input-url: /signup
      login-failure-url: /login-failure
  cors:
    allowed-origins: https://front.test
  # Swagger 접속 계정 (테스트 전용 값)
  swagger:
    username: swagger-test
    password: swagger-test-pw

management:
  server:
    # RANDOM_PORT 테스트는 실제 서버를 띄운다. 9090 고정이면 로컬에서 앱 실행 중이거나
    # 컨텍스트가 여러 개 뜰 때 포트가 충돌하므로 임의 포트를 쓴다.
    port: 0
  tracing:
    export:
      otlp:
        # 테스트에서는 트레이스를 외부로 보내지 않는다
        enabled: false
