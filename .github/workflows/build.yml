name: build

on:
  push:
    branches: ['development/**']

# gitops 레포 push 충돌 방지: dev 배포는 한 번에 하나씩, 순서대로
concurrency:
  group: build-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Docker Hub 저장소 (예: ject/naspi-server)
  IMAGE_REPOSITORY: jectteam2/naspi-server

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secret(DOCKERHUB_USERNAME=jectteam2)이 포함된 값은 job output 으로 전달되지 않으므로 태그만 넘김
    outputs:
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성/빌드 캐시 + wrapper 검증
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 이미지 태그: <build.gradle 의 version>-<커밋 날짜 yyyyMMdd (KST)>-<커밋 해시 7자리> (예: 1.0.0-20261011-ab288ae)
      # 날짜는 빌드 시각이 아닌 커밋 시각 기준 -> 같은 커밋을 다시 빌드해도 태그가 동일
      - name: Resolve image
        id: image
        run: |
          if [ -z "$IMAGE_REPOSITORY" ]; then
            echo "::error::build.yml 의 IMAGE_REPOSITORY 가 비어 있습니다."
            exit 1
          fi
          VERSION=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ -z "$VERSION" ]; then
            echo "::error::build.gradle 에서 version 을 읽지 못했습니다."
            exit 1
          fi
          DATE=$(TZ=Asia/Seoul git log -1 --format=%cd --date=format-local:%Y%m%d "$GITHUB_SHA")
          TAG="${VERSION}-${DATE}-${GITHUB_SHA::7}"
          echo "::notice::image tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=docker.io/${IMAGE_REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"

      # Jib이 ~/.docker/config.json 의 인증 정보를 사용
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 테스트는 PR 단계에서 통과한 코드만 머지되므로 생략
      - name: Build and push image (Jib)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: ./gradlew jib -Djib.to.image="$IMAGE"

  # Docker Hub push 후 manifest 레포의 dev 이미지 태그 수정
  push-dev:
    needs: build
    uses: ./.github/workflows/push-dev.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
