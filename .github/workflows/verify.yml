name: verify

# 머지 후 build.yml 에서 처음 드러나던 빌드·이미지 문제를 PR 단계에서 확인한다.
# checkstyle(check.yml), 테스트(test.yml)는 각자 돌고, 여기서는 컴파일·bootJar·Jib 이미지 생성만 검증한다.
# 이미지는 Docker Hub 에 push 하지 않고 tar 로만 만든다 (jibBuildTar, 인증 불필요).
on:
  pull_request:
    branches: ['development/**']

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성/빌드 캐시 + wrapper 검증
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 컴파일(main·test)과 실행 jar 생성
      - name: Build
        run: ./gradlew assemble testClasses

      # build.yml 의 jib 과 같은 설정으로 이미지를 만들되 push 하지 않는다
      - name: Build image (Jib, no push)
        run: ./gradlew jibBuildTar
