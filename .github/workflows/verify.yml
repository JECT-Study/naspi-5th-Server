name: verify

# 머지 후 build.yml 에서 처음 드러나던 컴파일·패키징 문제를 PR 단계에서 확인한다.
# checkstyle(check.yml), 테스트(test.yml)는 각자 돌고, 여기서는 main·test 컴파일과 실행 jar(bootJar) 생성만 검증한다.
on:
  pull_request:
    branches: ['development/**']

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성/빌드 캐시 + wrapper 검증
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 컴파일(main·test)과 실행 jar 생성
      - name: Compile and package
        run: ./gradlew assemble testClasses
